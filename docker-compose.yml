services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - video_assets:/app/video_assets/processed
      - experiment_results:/app/experiments/results/streaming
      - ./experiments/results/dqn_sample:/app/models:ro
    environment:
      STREAMIQ_DQN_CHECKPOINT: /app/models/model_final.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  video_assets:
  experiment_results:
